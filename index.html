<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký người dùng</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background-color: #f3f6fb;
            color: #222;
            margin: 0;
            padding: 24px;
        }
        .form-box {
            max-width: 480px;
            margin: 0 auto;
            background-color: #fff;
            padding: 24px 28px;
            border: 1px solid #d8e0ec;
            border-radius: 8px;
        }
        h1 {
            color: #1d4e89;
            font-size: 22px;
            text-align: center;
            margin: 0 0 20px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field > label,
        .group-title {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #b8c4d6;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
        }
        .options label {
            display: inline-block;
            margin-right: 16px;
            font-weight: normal;
        }
        .buttons {
            text-align: center;
            margin-top: 24px;
        }
        button {
            font-family: inherit;
            font-size: 15px;
            padding: 8px 24px;
            border: none;
            border-radius: 4px;
            background-color: #1d4e89;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Đăng ký người dùng</h1>

        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            <div class="field">
                <label for="name">Họ và tên</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="field options">
                <span class="group-title">Giới tính</span>
                <label><input type="radio" name="gender" value="male"> Nam</label>
                <label><input type="radio" name="gender" value="female"> Nữ</label>
                <label><input type="radio" name="gender" value="other"> Khác</label>
            </div>

            <div class="buttons">
                <button type="submit">Đăng ký</button>
            </div>
        </form>
    </div>
</body>
</html>
